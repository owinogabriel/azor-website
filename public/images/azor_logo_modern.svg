<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="modernGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E63946;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#457B9D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A9D8F;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Clean background -->
  <rect width="800" height="600" fill="#FAFAFA"/>
  
  <!-- Minimal geometric accents -->
  <g opacity="0.12">
    <polygon points="100,220 140,200 140,240" fill="url(#modernGrad)"/>
    <polygon points="700,230 660,210 660,250" fill="url(#modernGrad)"/>
    <circle cx="130" cy="320" r="15" fill="url(#modernGrad)"/>
    <circle cx="670" cy="310" r="12" fill="url(#modernGrad)"/>
  </g>
  
  <!-- Main AZOR text - cleaner approach -->
  <g>
    <!-- Outer stroke -->
    <text x="400" y="310" font-family="Arial Black, sans-serif" font-size="160" font-weight="900" fill="none" text-anchor="middle" stroke="#1A1A1A" stroke-width="16" letter-spacing="-5">AZOR</text>
    
    <!-- Inner gradient -->
    <text x="400" y="310" font-family="Arial Black, sans-serif" font-size="160" font-weight="900" fill="url(#modernGrad)" text-anchor="middle" letter-spacing="-5" filter="url(#glow)">AZOR</text>
  </g>
  
  <!-- Minimal drip accents -->
  <g opacity="0.5">
    <line x1="240" y1="315" x2="240" y2="345" stroke="#E63946" stroke-width="5" stroke-linecap="round"/>
    <circle cx="240" cy="348" r="4" fill="#E63946"/>
    
    <line x1="400" y1="320" x2="400" y2="355" stroke="#457B9D" stroke-width="6" stroke-linecap="round"/>
    <circle cx="400" cy="359" r="5" fill="#457B9D"/>
    
    <line x1="555" y1="318" x2="555" y2="350" stroke="#2A9D8F" stroke-width="5" stroke-linecap="round"/>
    <circle cx="555" cy="353" r="4" fill="#2A9D8F"/>
  </g>
  
  <!-- Modern banner -->
  <rect x="200" y="370" width="400" height="55" rx="5" fill="#1A1A1A"/>
  <rect x="200" y="370" width="400" height="3" rx="1.5" fill="url(#modernGrad)"/>
  
  <!-- Text on banner -->
  <text x="400" y="398" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="300" fill="#FFF" text-anchor="middle" letter-spacing="2">BRAND CUSTOMZ</text>
  
  <!-- Phone numbers -->
  <text x="400" y="416" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#CCC" text-anchor="middle" letter-spacing="1">0782471151  •  0724687339</text>
  
  <!-- Corner accents -->
  <g opacity="0.6">
    <rect x="190" y="365" width="30" height="3" fill="url(#modernGrad)"/>
    <rect x="580" y="365" width="30" height="3" fill="url(#modernGrad)"/>
  </g>
</svg>